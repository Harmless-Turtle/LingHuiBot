services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped

    # 需要与 .env 文件中的基础配置对应
    environment:
      MODE: reverse_ws
      ONEBOT_URL: ws://nb2:9093/onebot/v11/ws
      WEBUI_TOKEN: LingHui
      TZ: Asia/Shanghai
      # ACCOUNT: 12345678

    ports:
      - "7001:6099"
    volumes:
      - /turtle/Docker/NapCatData/qq:/app/.config/QQ
      - /turtle/Docker/NapCatData/config:/app/napcat/config
      - /turtle/Docker/NapCatData/plugins:/app/napcat/plugins

  nb2:
    build:
      context: .
    container_name: nb2
    restart: unless-stopped
    init: true

    depends_on:
      - napcat

    environment:
      TZ: Asia/Shanghai

    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os,socket; socket.create_connection((\"127.0.0.1\", int(os.environ.get(\"PORT\", \"9090\"))), 3)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    env_file:
      - .env

    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
      - ./config:/app/config
      - ./migrations:/app/migrations
      - ./linghui.db:/app/linghui.db
      - ./extra_package/background.png:/app/.venv/lib/python3.12/site-packages/nonebot_plugin_kawaii_status/resources/images/background.png:ro

    command: ["uv", "run", "--frozen", "python", "bot.py"]
