name: CI

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.md" # 忽略所有 markdown 改动
      - "markdown/**" # 忽略文档目录
      - ".gitignore"
  pull_request:
    branches:
      - dev111
      - main
    paths-ignore:
      - "**.md"
      - "markdown/**"
      - ".gitignore"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 环境配置与语法检查
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12.0"
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen --no-install-project

      - name: 语法检查
        run: uv run --no-sync python -m compileall -q src bot.py

      - name: 类型检查
        run: uv run --with pyright pyright

  smoke-test:
    name: 启动冒烟测试
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12.0"
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen --no-install-project

      - name: 准备运行配置
        run: cp .env.example .env

      - name: 同步数据库结构
        run: uv run nb orm sync

      - name: 启动冒烟测试
        run: uv run --with pytest pytest tests/test_smoke.py

  build-and-push:
    name: 构建并推送 Docker 镜像
    needs: [check, smoke-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 拉取源码
        uses: actions/checkout@v7

      - name: 登录 GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/harmless-turtle/linghuibot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max